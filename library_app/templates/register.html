{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="auth-panel panel">
  <p class="eyebrow">Join the library</p>
  <h1>Create a student account</h1>
  <p class="muted">Register with your email address to access the student portal. Email addresses are not verified.</p>
  <form method="post" action="{{ url_for('register') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label>Full name
      <input name="name" autocomplete="name" maxlength="160" required autofocus>
    </label>
    <label>Email address
      <input type="email" name="email" autocomplete="email" maxlength="254" required>
    </label>
    <label>Password (12–128 characters)
      <input type="password" name="password" autocomplete="new-password" minlength="12" maxlength="128" required>
    </label>
    <button type="submit">Create account</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Sign in</a>.</p>
</section>
{% endblock %}
