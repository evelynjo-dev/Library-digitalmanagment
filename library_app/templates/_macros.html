{% macro card(b) %}
<a class="card" href="{{ url_for('book', book_id=b.book_id) }}">
  <img class="cover" loading="lazy" alt="Cover of {{ b.title }}"
       src="{{ b.cover_url or url_for('cover', book_id=b.book_id) }}">
  <div class="meta">
    <div class="title">{{ b.title }}</div>
    <div class="author">{{ b.author }}</div>
    <div class="row">
      <span class="badge {{ b.available|avail_class }}">
        {% if b.available == 0 %}All issued{% else %}{{ b.available }} of {{ b.total }} available{% endif %}
      </span>
    </div>
    <div class="loc">Rack {{ b.rack }} · Row {{ b.shelf_row }}</div>
  </div>
</a>
{% endmacro %}
