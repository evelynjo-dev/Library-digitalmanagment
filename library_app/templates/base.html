<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Catalog{% endblock %} · Smart Library</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="{{ url_for('index') }}">&#128218; Smart Library</a>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'on' if request.endpoint in ('index','book') }}">Catalog</a>
      <a href="{{ url_for('floor_map') }}" class="{{ 'on' if request.endpoint == 'floor_map' }}">Floor map</a>
      <a href="{{ url_for('scan') }}" class="{{ 'on' if request.endpoint == 'scan' }}">Scan desk</a>
      <a href="{{ url_for('dashboard') }}" class="{{ 'on' if request.endpoint == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('members') }}" class="{{ 'on' if request.endpoint == 'members' }}">Members</a>
    </nav>
  </div>
</header>
<main class="wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="wrap foot">Design Studio I · Scan-based Library Book Manager</footer>
<script src="{{ url_for('static', filename='library-ui.js') }}"></script>
</body>
</html>
